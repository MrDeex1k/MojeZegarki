name: iOS regression
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    # Runner must have Xcode 27 and both runtimes installed; no automatic SDK downloads.
    runs-on: [self-hosted, macOS, ARM64, xcode-27]
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - device: iPhone 12
            os: '17.5'
          - device: iPhone 18 Pro
            os: '27.0'
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Toolchain
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Formatting
        run: bash scripts/format.sh --check
      - name: Unit and UI tests (PL/EN, light/dark, accessibility size)
        env:
          IOS_DESTINATION: platform=iOS Simulator,name=${{ matrix.device }},OS=${{ matrix.os }}
          RESULT_PATH: .build/Regression.xcresult
        run: bash scripts/test-ios.sh
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: results-${{ matrix.device }}
          path: .build/*.xcresult
          include-hidden-files: true
